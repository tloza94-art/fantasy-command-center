<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fantasy CC">
<title>Fantasy Command Center</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div><div class="eyebrow">PERSONAL PWA</div><h1>Fantasy Command Center</h1></div><button id="refreshBtn">↻</button></header>
<main>
<section class="card">
<label>Sleeper manager</label>
<div class="row"><input id="username" value="Txeagle" autocapitalize="none"><button id="loadBtn">Load</button></div>
<div id="statusText" class="muted">Ready.</div>
</section>

<section id="homeView" class="view active">
<div class="stats">
<div class="stat"><span>Leagues</span><strong id="leagueCount">—</strong></div>
<div class="stat danger"><span>Must Fix</span><strong id="mustFixCount">—</strong></div>
<div class="stat warn"><span>Q / D</span><strong id="watchCount">—</strong></div>
<div class="stat"><span>Multi Risk</span><strong id="riskCount">—</strong></div>
</div>
<h2>🚨 Fix These Lineups First</h2><div id="mustFixList" class="stack"></div>
<h2>⚠️ Watch Before Kickoff</h2><div id="watchList" class="stack"></div>
<h2>🔥 Multi-League Injury Exposure</h2><div id="riskList" class="stack"></div>
</section>

<section id="teamsView" class="view">
<section class="card"><label>League</label><select id="leagueSelect"></select></section>
<div id="teamRoster"></div>
</section>

<section id="playersView" class="view">
<section class="card"><label>Search player</label><input id="playerSearch" placeholder="Bijan, Jefferson, Allen..."></section>
<div id="playerResults" class="stack"></div>
</section>

<section id="exposureView" class="view"><div id="exposureList" class="stack"></div></section>
</main>

<nav>
<button class="nav active" data-view="homeView">🏠<small>Home</small></button>
<button class="nav" data-view="teamsView">🏈<small>Teams</small></button>
<button class="nav" data-view="playersView">🔎<small>Players</small></button>
<button class="nav" data-view="exposureView">📊<small>Exposure</small></button>
</nav>

<script src="app.js"></script>
</body></html>
